name: Lane F Prettier Scratch

on:
  push:
    branches:
      - tmp/prettier-phase20-f-20261001
    paths:
      - ".github/workflows/prettier-sandbox.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install exact Prettier
        run: npm install --no-package-lock --no-save prettier@3.9.6
      - name: Format Lane F proof
        run: |
          set -euo pipefail
          FILE="scratch/phase20-f/assistant-public-place-binding.test.ts"
          npx prettier --write "$FILE"
          npx prettier --check "$FILE"
          echo "FORMATTED_SHA256=$(sha256sum "$FILE" | cut -d' ' -f1)"
          echo "FORMATTED_BASE64_BEGIN"
          base64 -w0 "$FILE"
          echo
          echo "FORMATTED_BASE64_END"
