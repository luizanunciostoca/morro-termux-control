name: Lane F Prettier Scratch

on:
  push:
    branches:
      - tmp/prettier-phase20-f-20261001
    paths:
      - ".github/workflows/prettier-sandbox.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install exact Prettier
        run: npm install --no-package-lock --no-save prettier@3.9.6
      - name: Format and persist Lane F proof
        run: |
          set -euo pipefail
          FILE="scratch/phase20-f/assistant-public-place-binding.test.ts"
          npx prettier --write "$FILE"
          npx prettier --check "$FILE"
          git config user.name "Lane F Prettier Scratch"
          git config user.email "lane-f-prettier@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then
            echo "FORMAT_ALREADY_CANONICAL"
          else
            git commit -m "chore: persist exact Prettier output"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
