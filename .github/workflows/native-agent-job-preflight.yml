name: Native Agent Job Preflight

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

jobs:
  validate:
    if: >-
      startsWith(github.event.issue.title, '[TERMUX-JOB] ') &&
      github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate and attest exact request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -Eeuo pipefail
          source scripts/termux-job-protocol.sh
          jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH" > request.json

          reject() {
            local reason="$1"
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body "MORRO_JOB_PREFLIGHT_REJECTED_V3 — $reason" >/dev/null || true
            gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" >/dev/null || true
            exit 65
          }

          [[ "$ISSUE_AUTHOR" == "$REPOSITORY_OWNER" ]] ||
            reject "issue author is not the repository owner."

          morro_validate_request_file request.json ||
            reject "invalid JSON or protocol-v2 request schema."

          request_hash="$(morro_request_sha256 request.json)"
          marker="$(morro_preflight_marker "$request_hash")"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "$marker" >/dev/null
          printf '%s\n' "MORRO_JOB_PREFLIGHT_ATTESTED_V3 request_sha256=$request_hash"
