name: Native Agent Regression

on:
  pull_request:
    paths:
      - "scripts/termux-native-agent.sh"
      - "scripts/termux-native-agentctl.sh"
      - "scripts/termux-native-supervisor.sh"
      - "scripts/termux-native-agent-heartbeat.test.sh"
      - "CHATGPT-START-HERE.md"
      - ".github/workflows/native-agent-regression.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/termux-native-agent.sh"
      - "scripts/termux-native-agentctl.sh"
      - "scripts/termux-native-supervisor.sh"
      - "scripts/termux-native-agent-heartbeat.test.sh"
      - "CHATGPT-START-HERE.md"
      - ".github/workflows/native-agent-regression.yml"

permissions:
  contents: read

jobs:
  native-agent-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify native agent lifecycle, singleton, and discovery
        run: bash scripts/termux-native-agent-heartbeat.test.sh
